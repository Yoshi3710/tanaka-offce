name: Tanaka prototype regression checks

on:
  push:
    paths:
      - index.html
      - staff.html
      - sales.html
      - ocr.html
      - tests/check-sales-browser.cjs
      - tests/check-forms-print.cjs
      - tests/check-sales-handoff.cjs
      - tests/verify.cjs
      - tests/check-data-model.cjs
      - tests/fixtures/workflow-demo.json
      - docs/CURRENT_SPEC.md
      - docs/DATA_MODEL_DRAFT.md
      - docs/SALES_REP_WORKFLOW.md
      - scripts/build-preview.cjs
      - assets/logo.webp
      - .github/workflows/verify.yml
  pull_request:
    paths:
      - index.html
      - staff.html
      - sales.html
      - ocr.html
      - tests/check-sales-browser.cjs
      - tests/check-forms-print.cjs
      - tests/check-sales-handoff.cjs
      - tests/verify.cjs
      - tests/check-data-model.cjs
      - tests/fixtures/workflow-demo.json
      - docs/CURRENT_SPEC.md
      - docs/DATA_MODEL_DRAFT.md
      - docs/SALES_REP_WORKFLOW.md
      - scripts/build-preview.cjs
      - assets/logo.webp
      - .github/workflows/verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run dependency-free regression checks
        run: |
          node tests/verify.cjs
          node tests/check-data-model.cjs
      - name: Check sales workspace in Chrome (desktop and mobile widths)
        run: node tests/check-sales-browser.cjs
      - name: Check sales-to-document handoff and split delivery in Chrome
        run: node tests/check-sales-handoff.cjs
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Check PDF printing of all four common forms
        run: node tests/check-forms-print.cjs
      - name: Upload PDF and screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tanaka-pdf-evidence
          path: pdf-evidence/
          if-no-files-found: warn
      - name: Build verified static preview package
        run: node scripts/build-preview.cjs
      - name: Upload static preview package
        uses: actions/upload-artifact@v4
        with:
          name: tanaka-xserver-preview
          path: dist/
          if-no-files-found: error
          retention-days: 30
