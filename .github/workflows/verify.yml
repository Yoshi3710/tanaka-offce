name: Tanaka prototype regression checks

on:
  push:
    paths:
      - index.html
      - staff.html
      - tests/verify.cjs
      - tests/check-data-model.cjs
      - tests/fixtures/workflow-demo.json
      - docs/CURRENT_SPEC.md
      - docs/DATA_MODEL_DRAFT.md
      - docs/SALES_REP_WORKFLOW.md
      - .github/workflows/verify.yml
  pull_request:
    paths:
      - index.html
      - staff.html
      - tests/verify.cjs
      - tests/check-data-model.cjs
      - tests/fixtures/workflow-demo.json
      - docs/CURRENT_SPEC.md
      - docs/DATA_MODEL_DRAFT.md
      - docs/SALES_REP_WORKFLOW.md
      - .github/workflows/verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run dependency-free regression checks
        run: |
          node tests/verify.cjs
          node tests/check-data-model.cjs
