<body>
<header class="head">
<img src="assets/logo.webp" alt="株式会社タナカ ロゴ">
<div><h1>帳票作成プロトタイプ</h1><p>発注書・納品書・請求書／担当営業別入力・A4印刷</p></div>
<span class="trial">確認用・発注／送信機能なし</span>
</header>
<div class="notice" role="status">このページは帳票のレイアウト確認用です。実在の学校・児童生徒・取引先の個人情報を入力しないでください。入力内容の自動送信・サーバー保存は行いません。</div>
<main class="layout" id="mainLayout">
<section class="panel editor" aria-label="帳票編集">
<h2>帳票の入力・編集</h2>
<div class="field-grid">
<div class="field order-picker"><label for="type">帳票の種類</label><select id="type"><option value="order">発注書（A4縦）</option><option value="delivery">納品書（A4縦）</option><option value="invoice">請求書（A4縦）</option></select></div>
<div class="field order-picker"><label for="rep">担当営業</label><select id="rep"><option>大田</option><option>会野</option><option>藤井</option><option>長谷</option><option>恩田</option><option>社長</option></select></div>
<div class="field"><label for="number">帳票番号</label><input id="number" data-field="number" autocomplete="off" placeholder="例：T-2026-001"></div>
<div class="field"><label for="date">作成日</label><input type="date" id="date" data-field="date"></div>
<div class="field wide"><label for="school">学校名（仮の情報で確認）</label><input id="school" data-field="school" autocomplete="off" placeholder="例：○○市立△△中学校"></div>
<div class="field"><label for="schoolContact">学校のご担当者</label><input id="schoolContact" data-field="schoolContact" autocomplete="off" placeholder="例：担当の先生"></div>
<div class="field"><label for="schoolTel">学校TEL</label><input id="schoolTel" data-field="schoolTel" inputmode="tel" autocomplete="off"></div>
<div class="field"><label for="className">学年・組／所属</label><input id="className" data-field="className" autocomplete="off" placeholder="例：1年1組"></div>
<div class="field"><label for="operator">発注・作成者</label><input id="operator" data-field="operator" autocomplete="off" placeholder="例：担当営業名"></div>
<div class="field"><label for="contactTel">問い合わせTEL</label><input id="contactTel" data-field="contactTel" inputmode="tel" autocomplete="off"></div>
<div class="field wide order-only"><label for="maker">発注先メーカー名</label><input id="maker" data-field="maker" autocomplete="off" placeholder="例：○○教材株式会社"></div>
<div class="field order-only"><label for="orderClass">発注区分</label><select id="orderClass" data-field="orderClass"><option>学校直送</option><option>タナカ納入</option><option>その他</option></select></div>
<div class="field order-only"><label for="makerCode">メーカー／取引先コード（任意）</label><input id="makerCode" data-field="makerCode" autocomplete="off"></div>
<div class="field other-only"><label for="reference">参照注文番号（任意）</label><input id="reference" data-field="reference" autocomplete="off"></div>
<div class="field other-only"><label for="serviceDate">納品日・対象日（任意）</label><input id="serviceDate" data-field="serviceDate" autocomplete="off" type="date"></div>
<div class="field invoice-only"><label for="tax">消費税率（%）</label><input id="tax" data-field="tax" type="number" step="1" min="0" max="100"></div>
<div class="field wide"><label for="memo">備考・連絡事項</label><textarea id="memo" data-field="memo" placeholder="必要な事項のみ入力"></textarea></div>
</div>
<div class="section-title">商品明細 <small>明細は自由に追加・削除できます</small></div>
<div id="items" class="items"></div>
<div class="actions"><button id="add" type="button">＋ 明細を追加</button><button id="sample" type="button">架空の入力例を表示</button></div>
<div class="section-title">印刷・確認用操作</div>
<div class="actions">
<button class="primary" type="button" id="print">印刷／PDF保存</button>
<button type="button" id="download">入力データ保存（JSON）</button>
<button type="button" id="loadButton">JSON読み込み</button>
<button type="button" id="clear">初期化</button>
<input id="load" class="hidden" type="file" accept=".json,application/json">
</div>
<p class="help">PDF保存は印刷画面で「PDFに保存」を選択してください。JSONは利用者が自分の端末に保存する試作用データです。サイトには保存されません。共用PCでは個人情報を残さないようにしてください。</p>
</section>
<section class="panel sheet-panel" aria-label="帳票プレビュー">
<div class="sheet-top"><h2>印刷プレビュー</h2><span id="formatLabel" class="muted">発注書／A4縦</span></div>
<div class="sheet-wrap" id="sheetWrap"><article id="paper" class="paper order-form" aria-label="A4帳票"></article></div>
</section>
</main>
<script>
(function(){
"use strict";
var reps=["大田","会野","藤井","長谷","恩田","社長"];
var keys=["number","date","school","schoolContact","schoolTel","className","operator","contactTel","maker","orderClass","makerCode","makerAddress","makerTel","makerFax","makerContact","reference","serviceDate","tax","memo"];
var today=new Date(),localDate=today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");
var s={type:"order",rep:"大田",number:"",date:localDate,school:"",schoolContact:"",schoolTel:"",className:"",operator:"",contactTel:"06-6997-6030",maker:"",orderClass:"学校直送",makerCode:"",makerAddress:"",makerTel:"",makerFax:"",makerContact:"",reference:"",serviceDate:"",tax:"10",memo:"",items:[{sku:"",name:"",spec:"",qty:"",unit:"個",price:"",note:""}]};
var titles={order:"発注書",delivery:"納品書",invoice:"請求書"};
function byId(id){return document.getElementById(id);}
function escapeText(v){return String(v==null?"":v).replace(/[&<>"']/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];});}
function fmtDate(s){if(!s)return "（未入力）";var a=s.split("-");return a.length===3?a[0]+"年"+Number(a[1])+"月"+Number(a[2])+"日":escapeText(s);}
function number(v){var n=Number(v);return Number.isFinite(n)?n:0;}
function yen(v){return Math.round(v).toLocaleString("ja-JP");}
function rowItem(i,item){
 var fields=[["sku","品番"],["name","商品名"],["spec","規格・色など"],["qty","数量"],["unit","単位"],["price","単価（円）"],["note","備考"]];
 return '<div class="item"><div class="item-top"><span>明細 '+(i+1)+'</span><button type="button" data-remove="'+i+'">削除</button></div><div class="field-grid">'+fields.map(function(f){
  var isPrice=f[0]==="price",isQty=f[0]==="qty",value=escapeText(item[f[0]]);
  return '<div class="field '+(f[0]==="name"||f[0]==="note"?"wide":"")+' '+(isPrice?"price-field":"")+'"><label for="r'+i+f[0]+'">'+f[1]+'</label><input id="r'+i+f[0]+'" data-row="'+i+'" data-col="'+f[0]+'" value="'+value+'" '+(isQty||isPrice?'inputmode="decimal"':'')+' autocomplete="off"></div>';
 }).join("")+'</div></div>';
}
function renderRows(){
 byId("items").innerHTML=s.items.map(rowItem).join("");
 document.querySelectorAll(".price-field").forEach(function(el){el.classList.toggle("hidden",s.type==="order");});
}
function lineItems(){
 return s.items.map(function(it,i){
 var qty=number(it.qty),amount=qty*number(it.price);
 var cells='<td class="mid" style="width:7%">'+(i+1)+'</td><td style="width:14%">'+escapeText(it.sku)+'</td><td style="width:30%">'+escapeText(it.name)+'</td><td style="width:15%">'+escapeText(it.spec)+'</td><td class="num" style="width:9%">'+(it.qty===""?"":escapeText(it.qty))+'</td><td class="mid" style="width:7%">'+escapeText(it.unit)+'</td>';
 if(s.type!=="order") cells+='<td class="num">'+(it.price===""?"":yen(number(it.price)))+'</td><td class="num">'+(it.qty===""||it.price===""?"":yen(amount))+'</td>';
 cells+='<td>'+escapeText(it.note)+'</td>';
 return '<tr>'+cells+'</tr>';
 }).join("");
}
function invoiceTotal(){return s.items.reduce(function(a,it){return a+number(it.qty)*number(it.price);},0);}

function formField(k,label,placeholder){
 return '<input type="text" data-field="'+k+'" aria-label="'+escapeText(label)+'" value="'+escapeText(s[k]||"")+'" placeholder="'+escapeText(placeholder||"")+'" autocomplete="off">';
}
function formSelect(k,label,options){
 return '<select data-field="'+k+'" aria-label="'+escapeText(label)+'">'+options.map(function(o){return '<option'+(s[k]===o?' selected':'')+'>'+escapeText(o)+'</option>';}).join("")+'</select>';
}
function orderRows(){
 var rows=[],total=Math.max(5,s.items.length);
 var cols=[["sku","品番"],["name","商品名"],["spec","規格・色"],["qty","数量"],["unit","単位"],["note","摘要・備考"]];
 for(var i=0;i<total;i++){
  var it=s.items[i]||{sku:"",name:"",spec:"",qty:"",unit:"個",note:""};
  var tds=cols.map(function(c){return '<td><input type="text" data-row="'+i+'" data-col="'+c[0]+'" aria-label="'+(i+1)+'行目 '+c[1]+'" value="'+escapeText(it[c[0]]||"")+'"'+(c[0]==="qty"?' inputmode="decimal"':'')+' autocomplete="off"></td>';}).join("");

 '<div class="order-contact">株式会社タナカ　TEL：06-6997-6030　FAX：06-6997-6035　／　担当：<span id="orderStaffLabel">'+escapeText(s.rep)+'</span></div>'+
 '<div class="watermark">試作帳票・正式な注文／納品／請求には使用しないでください</div>'+
 '</div>';
}
function render(){
 document.querySelectorAll(".order-only").forEach(function(el){el.classList.toggle("hidden",s.type!=="order");});
 document.querySelectorAll(".other-only").forEach(function(el){el.classList.toggle("hidden",s.type==="order");});

 var title=titles[s.type],isOrder=s.type==="order",isInvoice=s.type==="invoice";
 byId("mainLayout").classList.toggle("order-mode",isOrder);
 if(isOrder){

 }
 var headDest=isOrder?s.maker:s.school;
 var table1=isOrder?
 [["発注区分",s.orderClass],["納品先",s.school],["学校担当",s.schoolContact],["学年・組",s.className],["学校TEL",s.schoolTel],["取引先コード",s.makerCode]]:
 [["学校担当",s.schoolContact],["学年・組",s.className],["学校TEL",s.schoolTel],["参照注文番号",s.reference],["納品日・対象日",fmtDate(s.serviceDate)]];
 var table2=[["担当営業",s.rep],["発注・作成者",s.operator],["問い合わせTEL",s.contactTel]];
 var show=function(v){return escapeText(v||"—");};
 var cells=function(a){return a.map(function(p){return '<tr><th>'+escapeText(p[0])+'</th><td>'+show(p[1])+'</td></tr>';}).join("");};
 var columns=isOrder?'<colgroup><col width="6%"><col width="14%"><col width="31%"><col width="16%"><col width="9%"><col width="7%"><col width="17%"></colgroup>':
 '<colgroup><col width="5%"><col width="11%"><col width="26%"><col width="12%"><col width="7%"><col width="6%"><col width="10%"><col width="11%"><col width="12%"></colgroup>';
 var headers='<th>№</th><th>品番</th><th>商品名</th><th>規格・色</th><th>数量</th><th>単位</th>'+(isOrder?'':'<th>単価</th><th>金額</th>')+'<th>摘要・備考</th>';
 var subtotal=invoiceTotal(),taxRate=Math.min(100,Math.max(0,number(s.tax))),tax=Math.floor(subtotal*taxRate/100);
 var totals=isOrder?'<div class="order-summary">合計数量： '+yen(s.items.reduce(function(a,it){return a+number(it.qty);},0))+' 点</div>':
 '<table class="totals"><tr><th>小計</th><td>¥ '+yen(subtotal)+'</td></tr>'+
 (isInvoice?'<tr><th>消費税（'+escapeText(taxRate)+'%）</th><td>¥ '+yen(tax)+'</td></tr>':'')+
 '<tr class="grand"><th>'+(isInvoice?'ご請求金額':'納品金額')+'</th><td>¥ '+yen(subtotal+(isInvoice?tax:0))+'</td></tr></table>';
 var note=s.memo?'<div class="note-print"><b>備考</b>：'+escapeText(s.memo)+'</div>':'';
 var intro=isOrder?'下記の内容にて発注いたします。':isInvoice?'下記の通り、ご請求申し上げます。':'下記の通り納品いたします。';
 byId("paper").className="paper"+(isOrder?" landscape":"");
 byId("paper").innerHTML='<div class="paper-inner">'+
 '<div class="print-h"><img src="assets/logo.webp" alt="株式会社タナカ"><div class="print-org"><b>株式会社タナカ</b><div>大阪府守口市南寺方東通3-8-6</div><div>TEL 06-6997-6030 ／ FAX 06-6997-6035</div></div></div>'+
 '<div class="print-title">'+title+'</div>'+
 '<div class="print-head"><div><div class="dest">'+(headDest?escapeText(headDest):"（宛先未入力）")+'　御中</div><div class="sub">'+(isOrder?'メーカー・仕入先への発注用':'学校提出用')+' ／ ご確認をお願いいたします。</div></div>'+
 '<table class="print-meta"><tr><th>'+title+'番号</th><td>'+show(s.number)+'</td></tr><tr><th>作成日</th><td>'+fmtDate(s.date)+'</td></tr></table></div>'+
 '<div class="intro">'+intro+'</div>'+
 '<div style="display:grid;grid-template-columns:1.2fr .8fr;gap:3mm"><table class="info-table">'+cells(table1)+'</table><table class="info-table">'+cells(table2)+'</table></div>'+
 '<div class="table-title">明細</div><table class="doc-items">'+columns+'<thead><tr>'+headers+'</tr></thead><tbody>'+lineItems()+'</tbody></table>'+
 totals+note+'<div class="footnote"><span>お問い合わせ：<b>株式会社タナカ</b> ／ '+show(s.contactTel)+'</span><span>担当営業：'+escapeText(s.rep)+'　作成者：'+show(s.operator)+'</span></div>'+
 '<div class="watermark">試作帳票・正式な注文／納品／請求には使用しないでください</div></div>';
 byId("formatLabel").textContent=title+"／A4"+(isOrder?"横":"縦");

}
function fitPaper(){
 var paper=byId("paper"),wrap=byId("sheetWrap");
 paper.style.zoom="1";
 var mmToPx=96/25.4,base=190*mmToPx;
 var scale=Math.min(1,Math.max(.25,(wrap.clientWidth-24)/base));
 paper.style.zoom=String(scale);
}
function sync(){
 byId("type").value=s.type;byId("rep").value=s.rep;
 keys.forEach(function(k){var el=byId(k);if(el)el.value=s[k]||"";});
 renderRows();render();
}
byId("type").addEventListener("change",function(){s.type=this.value;renderRows();render();});

keys.forEach(function(k){var el=byId(k);if(el)el.addEventListener("input",function(){s[k]=this.value;render();});});
byId("paper").addEventListener("input",function(e){
 var t=e.target,k=t.dataset.field,ri=t.dataset.row,col=t.dataset.col;
 if(k){
  if(k==="rep"){s.rep=t.value;byId("rep").value=s.rep;var staffLabel=byId("orderStaffLabel");if(staffLabel)staffLabel.textContent=s.rep;}else{s[k]=t.value;var linked=byId(k);if(linked)linked.value=t.value;}
 }else if(col!==undefined&&ri!==undefined){
  var i=Number(ri);
  while(s.items.length<=i)s.items.push({sku:"",name:"",spec:"",qty:"",unit:"個",price:"",note:""});
  s.items[i][col]=t.value;
  if(col==="qty"){var summary=byId("orderSummary");if(summary)summary.textContent=orderSummary();}
 }
});

 if(add){
  if(s.items.length>=40){alert("試作では40行までです。");return;}
  while(s.items.length<5)s.items.push({sku:"",name:"",spec:"",qty:"",unit:"個",price:"",note:""});
  s.items.push({sku:"",name:"",spec:"",qty:"",unit:"個",price:"",note:""});
  renderRows();render();return;
 }
 var remove=e.target.closest("[data-remove-order]");
 if(remove){
  var i=Number(remove.dataset.removeOrder);
  if(i<s.items.length)s.items.splice(i,1);
  if(!s.items.length)s.items.push({sku:"",name:"",spec:"",qty:"",unit:"個",price:"",note:""});

 }
});

byId("download").addEventListener("click",function(){var blob=new Blob([JSON.stringify({prototypeVersion:1,data:s},null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="tanaka_form_"+s.type+"_"+(s.date||"draft")+".json";a.click();setTimeout(function(){URL.revokeObjectURL(url);},1000);});
byId("loadButton").addEventListener("click",function(){byId("load").click();});
byId("load").addEventListener("change",function(){var file=this.files[0];this.value="";if(!file)return;if(file.size>250000){alert("読み込み可能なファイルは250KBまでです。");return;}var reader=new FileReader();reader.onload=function(){try{var obj=JSON.parse(reader.result);if(obj.prototypeVersion!==1||!obj.data||!Array.isArray(obj.data.items)||obj.data.items.length>40)throw Error("形式が異なります。");var d=obj.data;var next=Object.assign({},s);keys.forEach(function(k){if(typeof d[k]==="string")next[k]=d[k].slice(0,1000);});next.type=titles[d.type]?d.type:"order";next.rep=reps.indexOf(d.rep)>=0?d.rep:"大田";next.items=d.items.map(function(it){var o={};["sku","name","spec","qty","unit","price","note"].forEach(function(k){o[k]=typeof it[k]==="string"?it[k].slice(0,1000):"";});return o;});if(!next.items.length)next.items=[{sku:"",name:"",spec:"",qty:"",unit:"個",price:"",note:""}];if(!confirm("現在の入力内容を読み込んだ内容に置き換えます。よろしいですか？"))return;s=next;sync();}catch(err){alert("読み込めませんでした。試作で保存したJSONファイルか確認してください。");}};reader.readAsText(file);});
window.addEventListener("resize",fitPaper);sync();
})();
